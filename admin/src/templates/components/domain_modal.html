<!-- Interactive Attach Custom Domain & Ingress Modal -->
<dialog id="domain-modal" class="backdrop:bg-black/70 bg-transparent p-0 m-auto w-full max-w-md border-0 z-50">
  <div class="border border-rule-strong bg-surface p-6 flex flex-col gap-4 font-mono text-xs">
    <!-- Modal Header -->
    <div class="flex items-center justify-between border-b border-rule pb-3">
      <div class="flex items-center gap-2.5">
        <span class="size-3 bg-kube"></span>
        <h3 class="font-bold text-sm text-paper">Attach Custom Domain (Traefik Ingress)</h3>
      </div>
      <button type="button" onclick="closeDomainModal()" class="text-slate hover:text-paper text-lg font-bold">✕</button>
    </div>

    <!-- Domain Attachment Form -->
    <form id="domain-modal-form" hx-post="/dashboard/services/domain/attach" hx-target="#running-containers-list" hx-swap="outerHTML" onsubmit="closeDomainModal()" class="flex flex-col gap-4">
      <input type="hidden" id="domain-service-id" name="service_id" value="" />

      <!-- Custom Wildcard Subdomain Prefix & Availability Checker -->
      <div class="flex flex-col gap-1.5 bg-ink p-3 border border-rule">
        <label for="subdomain-prefix-input" class="text-slate text-[10px] uppercase font-bold">Choose Wildcard Subdomain Prefix (*.anubhav.fyi)</label>
        <div class="flex items-center gap-1">
          <input type="text" id="subdomain-prefix-input" name="subdomain_prefix" placeholder="e.g. my-api, cool-app"
            hx-get="/dashboard/domains/check-availability" hx-target="#subdomain-availability-status" hx-trigger="keyup delay:300ms, change"
            class="flex-1 bg-surface border border-rule-strong px-3 py-1.5 font-mono text-xs text-paper focus:border-kube focus:outline-none">
          <span class="text-slate font-mono text-xs">.anubhav.fyi</span>
        </div>
        <div id="subdomain-availability-status" class="mt-1">
          <span class="text-slate text-[10px] italic">Type a custom subdomain prefix to check real-time availability...</span>
        </div>
      </div>

      <!-- Custom External Domain Input -->
      <div class="flex flex-col gap-1">
        <label for="domain-custom-input" class="text-slate text-[10px] uppercase font-bold">Attach External Custom Domain</label>
        <input type="text" id="domain-custom-input" name="custom_domain" placeholder="e.g. api.mycompany.com, app.dev"
          class="w-full bg-ink border border-rule-strong px-3 py-2 text-paper placeholder:text-slate focus:border-kube focus:outline-none">
        <span class="text-slate-softer text-[10px]">Point your CNAME / A record to your VPS IP (<code class="text-paper">72.61.239.5</code>).</span>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-end gap-3 border-t border-rule pt-4">
        <button type="button" onclick="closeDomainModal()" class="px-4 py-2 bg-ink text-slate hover:text-paper font-bold text-xs uppercase tracking-wider">
          Cancel
        </button>
        <button type="submit" class="px-5 py-2 bg-kube text-ink font-bold text-xs uppercase tracking-wider hover:brightness-110">
          Save Ingress Rules
        </button>
      </div>
    </form>
  </div>
</dialog>

<script>
  function openDomainModal(serviceId, wildcardDomain, currentCustomDomain) {
    document.getElementById('domain-service-id').value = serviceId;
    let prefix = serviceId;
    if (wildcardDomain && wildcardDomain.includes('.')) {
      prefix = wildcardDomain.split('.')[0];
    }
    const prefixInput = document.getElementById('subdomain-prefix-input');
    if (prefixInput) {
      prefixInput.value = prefix;
      htmx.trigger(prefixInput, 'change');
    }
    document.getElementById('domain-custom-input').value = currentCustomDomain || '';
    
    const dialog = document.getElementById('domain-modal');
    if (dialog) dialog.showModal();
  }

  function closeDomainModal() {
    const dialog = document.getElementById('domain-modal');
    if (dialog) dialog.close();
  }
</script>
