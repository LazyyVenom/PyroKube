<div class="border border-rule-strong bg-surface p-5">
  <!-- Server Status Header -->
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-rule pb-3">
    <div class="flex items-center gap-2.5">
      <span class="relative flex size-2.5">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-ok opacity-75"></span>
        <span class="relative inline-flex size-2.5 rounded-full bg-ok"></span>
      </span>
      <h2 class="font-bold text-sm text-paper">Server Status</h2>
      <span class="font-mono text-[10px] text-slate uppercase tracking-wider border border-rule px-2 py-0.5 bg-surface-alt">
        Cluster Online
      </span>
    </div>
    <div class="flex items-center gap-3 font-mono text-xs text-paper-soft">
      <span>Nodes: <strong class="text-paper font-semibold">3/3 Healthy</strong></span>
      <span class="text-rule-strong">|</span>
      <span>API Server: <strong class="text-ok font-semibold">Ready</strong></span>
    </div>
  </div>

  <!-- Key Resource Metrics Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-4">
    <!-- CPU Usage -->
    <div class="flex flex-col gap-1 border-r border-rule pr-4 last:border-0">
      <span class="font-mono text-[10px] text-slate uppercase tracking-wider">CPU Usage</span>
      <div class="flex items-baseline justify-between">
        <span class="font-mono text-lg font-bold text-paper">18%</span>
        <span class="font-mono text-xs text-slate">12 Cores</span>
      </div>
      <div class="w-full bg-surface-alt h-1.5 overflow-hidden">
        <div class="bg-ember h-full" style="width: 18%"></div>
      </div>
    </div>

    <!-- Memory Usage -->
    <div class="flex flex-col gap-1 border-r border-rule pr-4 last:border-0">
      <span class="font-mono text-[10px] text-slate uppercase tracking-wider">Memory</span>
      <div class="flex items-baseline justify-between">
        <span class="font-mono text-lg font-bold text-paper">4.2 GB</span>
        <span class="font-mono text-xs text-slate">32 GB Max</span>
      </div>
      <div class="w-full bg-surface-alt h-1.5 overflow-hidden">
        <div class="bg-kube h-full" style="width: 13%"></div>
      </div>
    </div>

    <!-- Storage Volume -->
    <div class="flex flex-col gap-1">
      <span class="font-mono text-[10px] text-slate uppercase tracking-wider">Cluster Storage</span>
      <div class="flex items-baseline justify-between">
        <span class="font-mono text-lg font-bold text-paper">120 GB</span>
        <span class="font-mono text-xs text-slate">500 GB</span>
      </div>
      <div class="w-full bg-surface-alt h-1.5 overflow-hidden">
        <div class="bg-ok h-full" style="width: 24%"></div>
      </div>
    </div>
  </div>
</div>
