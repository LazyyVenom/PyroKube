<div class="service-card group relative flex flex-col justify-between border border-rule-strong bg-surface p-5 transition-all hover:border-ember"
  data-category="{{ service.category }}">
  <div>
    <div class="flex items-center justify-between border-b border-rule pb-3 mb-3">
      <h3 class="font-bold text-base text-paper group-hover:text-ember transition-colors">{{ service.name }}</h3>
      <span class="border border-rule-strong bg-surface-alt px-2 py-0.5 font-mono text-[10px] tracking-wider text-slate uppercase">
        {{ service.category_label }}
      </span>
    </div>

    <div class="flex items-center justify-between border-b border-rule pb-2 font-mono text-xs mb-3">
      <span class="text-[10px] text-slate uppercase">Status</span>
      <span class="inline-flex items-center gap-1.5 text-ok">
        <span class="size-1.5 rounded-full bg-ok"></span>{{ service.status }}
      </span>
    </div>
  </div>

  <div class="flex items-center gap-2 pt-2">
    <button onclick="openDeployModal('{{ service.name }}', '{{ service.port }}', '{{ service.subtitle }}')"
      class="flex-1 bg-ember px-3 py-2 text-center text-xs font-semibold text-paper hover:bg-ember-lift transition-colors">
      Deploy
    </button>
    <button onclick="openDeployModal('{{ service.name }}', '{{ service.port }}', '{{ service.subtitle }}')"
      class="border border-rule-strong px-3 py-2 text-xs font-mono text-paper-soft hover:bg-paper hover:text-ink transition-colors">
      Config
    </button>
  </div>
</div>
