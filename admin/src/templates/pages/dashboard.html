{% extends 'base.html' %} {% block title %}Dashboard — PyroKube{% endblock %} {%
block content %}
<div class="flex flex-col gap-6">
  {% set current_page = 'dashboard' %}

  <!-- Server Status Component -->
  {% include 'components/server_status.html' %}

  <!-- Managed Services Catalog Component -->
  {% include 'components/catalog_services.html' %}
</div>
        <button type="submit" id="submit-btn" class="bg-ember px-5 py-2 text-xs font-semibold text-paper hover:bg-ember-lift">
          Confirm & Provision
        </button>
      </div>
    </form>
  </div>
</dialog>

<script>
  let currentCatalogCategory = 'all';

  function setCatalogCategory(category) {
    currentCatalogCategory = category;
    const buttons = document.querySelectorAll('.catalog-tab-btn');

    buttons.forEach(btn => {
      btn.classList.remove('active-tab', 'bg-ember', 'text-paper', 'font-semibold');
      btn.classList.add('text-paper-soft');
    });

    const activeBtn = document.getElementById(`catalog-tab-${category}`);
    if (activeBtn) {
      activeBtn.classList.add('active-tab', 'bg-ember', 'text-paper', 'font-semibold');
      activeBtn.classList.remove('text-paper-soft');
    }

    filterCatalogServices();
  }

  function filterCatalogServices() {
    const searchInput = document.getElementById('catalog-search-input').value.toLowerCase().trim();
    const rows = document.querySelectorAll('.catalog-service-row');

    let counts = {
      all: 0,
      database: 0,
      uploads: 0,
      registry: 0
    };

    rows.forEach(row => {
      const category = row.getAttribute('data-category');
      const text = row.innerText.toLowerCase();
      const matchesSearch = text.includes(searchInput);

      if (matchesSearch) {
        counts.all++;
        if (counts[category] !== undefined) {
          counts[category]++;
        }
      }

      const matchesCategory = (currentCatalogCategory === 'all' || category === currentCatalogCategory);

      if (matchesCategory && matchesSearch) {
        row.style.display = '';
      } else {
        row.style.display = 'none';
      }
    });

    const btnAll = document.getElementById('catalog-tab-all');
    const btnDb = document.getElementById('catalog-tab-database');
    const btnUp = document.getElementById('catalog-tab-uploads');
    const btnReg = document.getElementById('catalog-tab-registry');

    if (btnAll) btnAll.innerText = `All (${counts.all})`;
    if (btnDb) btnDb.innerText = `DB (${counts.database})`;
    if (btnUp) btnUp.innerText = `Uploads (${counts.uploads})`;
    if (btnReg) btnReg.innerText = `Registry (${counts.registry})`;
  }

  function openDeployModal(serviceName, port, subtitle) {
    document.getElementById('modal-service-name').innerText = `Provision ${serviceName}`;
    document.getElementById('modal-service-port').value = port || '5432';
    document.getElementById('modal-success-alert').classList.add('hidden');
    
    const modal = document.getElementById('deploy-service-modal');
    modal.showModal();
  }

  function closeDeployModal() {
    const modal = document.getElementById('deploy-service-modal');
    modal.close();
  }

  function handleServiceDeploy(e) {
    e.preventDefault();
    const alertBox = document.getElementById('modal-success-alert');
    alertBox.classList.remove('hidden');

    setTimeout(() => {
      closeDeployModal();
    }, 1200);
  }

  function toggleCatalogMenu(e, menuId) {
    e.stopPropagation();
    document.querySelectorAll('.catalog-action-menu').forEach(menu => {
      if (menu.id !== menuId) menu.classList.add('hidden');
    });
    const targetMenu = document.getElementById(menuId);
    if (targetMenu) {
      targetMenu.classList.toggle('hidden');
    }
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.catalog-action-menu').forEach(menu => menu.classList.add('hidden'));
  });
</script>
{% endblock %}
